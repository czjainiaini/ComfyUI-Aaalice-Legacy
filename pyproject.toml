[project]
name = "comfyui-aaalice-legacy"
version = "1.0.3"
description = "Unofficial legacy Aaalice nodes with independent IDs for coexistence with ComfyUI-Aaalice-Nodes"
authors = [{ name = "ComfyUI-Danbooru-Gallery Contributors" }]
license = { text = "MIT" }
dependencies = [
    "requests>=2.28.0",
    "aiohttp>=3.8.0",
    "aiosqlite>=0.17.0",
    "psutil>=5.9.0",
    "Pillow>=9.0.0",
    "torch>=1.12.0",
    "numpy>=1.21.0",
]
requires-python = ">=3.8"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["."]

[tool.setuptools.package-data]
"." = ["js/*.js", "zh_cn/*.json", "zh_cn/*.csv"]

[project.urls]
Homepage = "https://github.com/czjainiaini/ComfyUI-Aaalice-Legacy"
Repository = "https://github.com/czjainiaini/ComfyUI-Aaalice-Legacy.git"
Issues = "https://github.com/czjainiaini/ComfyUI-Aaalice-Legacy/issues"
Documentation = "https://github.com/czjainiaini/ComfyUI-Aaalice-Legacy/blob/coexistence/README.md"
